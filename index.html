<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL NATIONS PRO V4.8 - Hidden Passwords</title>
<link rel="manifest" href="./manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0f172a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#7A0C1A;padding:10px;text-align:center;font-weight:900}
.login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
.choice{border-radius:16px;padding:20px;text-align:center;cursor:pointer}
.manager-choice{background:linear-gradient(135deg,#7A0C1A,#c0392b)}
.cashier-choice{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.card{background:white;color:#222;border-radius:12px;padding:12px;margin:8px}
.hidden{display:none}
button{background:#7A0C1A;color:white;border:none;padding:10px;border-radius:8px;font-weight:800;cursor:pointer;width:100%}
input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin:6px 0}
</style>
</head>
<body>
<header>ALL NATIONS PRO V4.8 - OFFLINE</header>
<div id="loginPage" class="login-wrap">
<div class="choice-grid">
<div class="choice manager-choice" onclick="selectRole('manager')">👑<br><b>المدير</b></div>
<div class="choice cashier-choice" onclick="selectRole('cashier')">🧾<br><b>الكاشير</b></div>
</div>
<div id="passBox" class="card hidden" style="width:100%;max-width:420px;margin-top:16px">
<h4 id="selectedRoleText"></h4>
<input id="passwordInput" type="password" placeholder="كلمة السر">
<button onclick="doLogin()">دخول</button>
<div id="loginMsg" style="color:red;font-size:11px"></div>
</div>
</div>
<div id="appPage" class="hidden"></div>
<script>
const SECRET_USERS = {
 manager: {pass: "admin123", role:"manager"},
 cashier: {pass: "1234", role:"cashier"}
};
let selectedRoleKey=null; let currentUser=null;
function selectRole(role){
 selectedRoleKey=role;
 document.getElementById('passBox').classList.remove('hidden');
 document.getElementById('selectedRoleText').textContent = role==='manager' ? '👑 دخول المدير' : '🧾 دخول الكاشير';
}
function doLogin(){
 let p=document.getElementById('passwordInput').value;
 if(SECRET_USERS[selectedRoleKey].pass !== p){ document.getElementById('loginMsg').textContent='كلمة السر خطأ'; return; }
 currentUser={username:selectedRoleKey, role:SECRET_USERS[selectedRoleKey].role};
 document.getElementById('loginPage').classList.add('hidden');
 document.getElementById('appPage').classList.remove('hidden');
}
// ... باقي كود المنيو - المدير فقط - نفس V4.7
</script>
</body>
</html>
