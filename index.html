<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARINA - License & Logbook Management System</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2540">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFC107;--dark:#0A2540;--dark2:#102E50;--bg:#F4F7FB;--card:#FFF;--border:#E2E8F0;--text:#1A2A44;--muted:#6B7A90;--green:#10B981;--red:#EF4444}
*{box-sizing:border-box;font-family:'Inter',sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--text)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dark),var(--dark2));padding:20px}
.login-card{background:white;width:100%;max-width:460px;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.tabs{display:flex;background:#F1F5F9;border-radius:10px;padding:4px;margin:16px 0}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.tab.active{background:var(--dark);color:white}
.input-group{margin-top:12px}
.input-group label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.input-group input,.input-group select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;outline:none}
.input-group input:focus{border-color:var(--yellow)}
.btn{padding:11px 16px;border-radius:9px;font-weight:700;font-size:13px;border:none;cursor:pointer}
.btn-dark{background:var(--dark);color:white;width:100%;margin-top:16px}
.btn-yellow{background:var(--yellow);color:var(--dark)}
.file-drop{border:2px dashed #FFC107;background:#FFF8E1;padding:18px;border-radius:12px;text-align:center;font-size:12px;margin-top:10px;cursor:pointer}
.app{display:none;min-height:100vh}
.sidebar{position:fixed;right:0;top:0;bottom:0;width:270px;background:var(--dark);color:white;display:flex;flex-direction:column}
.main{margin-right:270px}
.topbar{background:white;padding:14px 24px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.badge{background:var(--yellow);color:var(--dark);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.content{padding:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:white;border-radius:14px;padding:16px;border:1px solid var(--border)}
.form-box{background:white;border-radius:14px;padding:18px;border:1px solid var(--border);margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:9px 8px;font-size:12px;border-bottom:1px solid var(--border);text-align:left}
th{background:#F8FAFC;color:var(--muted);font-size:11px}
.nav-item{padding:10px 12px;border-radius:9px;color:#B8C6DA;font-size:13px;cursor:pointer;margin-bottom:3px}
.nav-item.active,.nav-item:hover{background:rgba(255,193,7,0.12);color:var(--yellow)}
.dev-mark{position:fixed;left:10px;bottom:10px;background:var(--dark);color:white;padding:6px 12px;border-radius:20px;font-size:10px}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div style="text-align:center"><div style="width:56px;height:56px;background:var(--yellow);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:var(--dark)">A</div><h2 style="margin-top:10px">ARINA</h2><p style="font-size:12px;color:var(--muted)">License & Logbook System V3</p></div>
    <div class="tabs"><div class="tab active" id="tab-staff" onclick="switchTab('staff')">Staff Login</div><div class="tab" id="tab-admin" onclick="switchTab('admin')">Admin Token</div></div>
    <div id="staffLogin">
      <div class="input-group"><label>Branch Code</label><select id="branchSelect"><option value="main">main - Juba Main</option><option value="wau">wau - Wau</option><option value="malakal">malakal - Malakal</option><option value="yambio">yambio - Yambio</option></select></div>
      <div class="input-group"><label>Username</label><input id="userInput" placeholder="Enter username"></div>
      <div class="input-group"><label>Password</label><input id="passInput" type="password" placeholder="Enter password"></div>
      <button class="btn btn-dark" onclick="loginStaff()">Login</button>
    </div>
    <div id="adminLogin" style="display:none">
      <div class="input-group"><label>Admin Username</label><input id="adminUser" value="admin"></div>
      <div class="input-group"><label>Admin Password</label><input id="adminPass" type="password" placeholder="Admin password"></div>
      <div class="file-drop" onclick="document.getElementById('tokenFile').click()">📁 Click to Select USB Token File (arina_admin_token.key)<input type="file" id="tokenFile" accept=".key,.txt" style="display:none" onchange="handleTokenFile(this)"><div id="tokenStatus" style="margin-top:8px;color:var(--muted)">No file selected</div></div>
      <button class="btn btn-dark" onclick="loginWithToken()">Login with USB Token</button>
      <div style="margin-top:10px;text-align:center"><a href="#" onclick="loginStaffAdminFallback()" style="font-size:11px;color:var(--muted)">Or login with normal admin password (fallback)</a></div>
    </div>
    <div style="text-align:center;font-size:10px;color:#94A3B8;margin-top:14px">Secure Login • Encrypted Token • Developed by <b>E-Mutwokil Sadik</b></div>
  </div>
</div>
    </div>
  </div>
</div>
<div class="dev-mark">Developed by <b>E-Mutwokil Sadik</b> | ARINA v2.0</div>
<div class="modal" id="receiptModal" onclick="if(event.target==this)closeModal()"><div class="modal-card" id="receiptContent"></div></div>
<div class="print-area" id="printArea"></div>
<script type="module">
const firebaseConfig = {apiKey:"YOUR_API_KEY",authDomain:"arina-system.firebaseapp.com",projectId:"arina-system",storageBucket:"arina-system.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abcdef"};
let currentBranch='main',currentUser='admin',currentRole='admin';
const store={get(k){try{return JSON.parse(localStorage.getItem('arina_'+k)||'[]')}catch(e){return []}},set(k,v){localStorage.setItem('arina_'+k,JSON.stringify(v))},push(k,item){const arr=store.get(k);arr.push(item);store.set(k,arr);return arr}};
window.login=function(){const branch=document.getElementById('branchSelect').value;const user=document.getElementById('userInput').value.trim().toLowerCase();const pass=document.getElementById('passInput').value;let info=null;if((user==='admin'||user==='manager'||user==='finance'||user==='tech')&&(pass==='123'||pass==='admin123')){info={role:user==='admin'?'admin':user,branch:branch}}if(!info){alert('خطأ في الدخول');return}currentBranch=info.branch;currentUser=user;currentRole=info.role;document.getElementById('loginWrap').style.display='none';document.getElementById('app').style.display='block';document.getElementById('branchLabel').textContent=branch.toUpperCase();document.getElementById('roleBadge').textContent=branch.toUpperCase()+' - '+info.role.toUpperCase();document.getElementById('userRoleLabel').textContent='User:'+user+' | Branch:'+branch;refreshAll();}
window.logout=()=>location.reload();
window.showPage=function(p){document.querySelectorAll('.page').forEach(el=>el.style.display='none');document.getElementById('page-'+p).style.display='block';document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById('pageTitle').textContent=p;refreshAll();}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function genId(prefix){return prefix+'-'+Date.now().toString().slice(-6)+'-'+Math.floor(100+Math.random()*900)}
window.createLicense=function(){const name=document.getElementById('lic_name').value.trim();const phone=document.getElementById('lic_phone').value.trim();if(!name||!phone){alert('ادخل الاسم والهاتف');return}const rec={id:genId('LIC'),name,phone,type:document.getElementById('lic_type').value,duration:document.getElementById('lic_duration').value,amount:parseFloat(document.getElementById('lic_amount').value)||0,pay:document.getElementById('lic_pay').value,notes:document.getElementById('lic_notes').value,branch:currentBranch,user:currentUser,date:new Date().toISOString(),dateStr:new Date().toLocaleDateString('ar-EG')};store.push('licenses',rec);store.push('activities',{type:'رخصة',client:name,amount:rec.amount,branch:rec.branch,status:'مكتمل',date:rec.date});printReceipt('license',rec);const clean=phone.replace(/[^0-9]/g,'');window.open(`https://wa.me/${clean}?text=${encodeURIComponent('مرحبا '+name+' - ايصال رخصة '+rec.id+' - $'+rec.amount+' - ARINA فرع '+rec.branch)}`,'_blank');refreshAll();}
window.createRegistration=function(){const name=document.getElementById('reg_name').value.trim();const plate=document.getElementById('reg_plate').value.trim();if(!name||!plate){alert('ادخل الاسم واللوحة');return}const rec={id:genId('REG'),name,plate,vtype:document.getElementById('reg_vtype').value,model:document.getElementById('reg_model').value,chassis:document.getElementById('reg_chassis').value,amount:parseFloat(document.getElementById('reg_amount').value)||0,branch:currentBranch,user:currentUser,date:new Date().toISOString(),dateStr:new Date().toLocaleDateString('ar-EG')};store.push('registrations',rec);store.push('activities',{type:'شهادة',client:name,amount:rec.amount,branch:rec.branch,status:'مكتمل',date:rec.date});printReceipt('registration',rec);refreshAll();}
window.addExpense=function(){const amount=parseFloat(document.getElementById('exp_amount').value);if(!amount){alert('ادخل المبلغ');return}store.push('expenses',{id:genId('EXP'),item:document.getElementById('exp_item').value,amount,desc:document.getElementById('exp_desc').value,branch:currentBranch,date:new Date().toISOString(),dateStr:new Date().toLocaleDateString('ar-EG')});refreshAll();}
window.addEmployee=function(){const name=document.getElementById('emp_name').value.trim();if(!name){alert('ادخل الاسم');return}store.push('employees',{id:genId('EMP'),name,title:document.getElementById('emp_title').value,grade:document.getElementById('emp_grade').value,salary:parseFloat(document.getElementById('emp_salary').value)||0,branch:currentBranch,date:new Date().toISOString()});refreshAll();}
window.addAdvance=function(){const empId=document.getElementById('adv_emp').value;const amount=parseFloat(document.getElementById('adv_amount').value);if(!empId||!amount){alert('اختر الموظف');return}const emps=store.get('employees');const emp=emps.find(e=>e.id===empId);store.push('advances',{id:genId('ADV'),empId,empName:emp?emp.name:empId,amount,reason:document.getElementById('adv_reason').value,branch:currentBranch,date:new Date().toISOString(),dateStr:new Date().toLocaleDateString('ar-EG'),status:'غير مسددة'});refreshAll();}
function refreshAll(){const licenses=store.get('licenses'),regs=store.get('registrations'),exps=store.get('expenses'),emps=store.get('employees'),advs=store.get('advances'),acts=store.get('activities');const filterBranch=(arr)=>currentBranch==='main'&&currentRole==='admin'?arr:arr.filter(a=>a.branch===currentBranch);const fLic=filterBranch(licenses),fReg=filterBranch(regs),fExp=filterBranch(exps),fEmp=filterBranch(emps),fAdv=filterBranch(advs),fAct=filterBranch(acts);document.getElementById('statLicense').textContent=fLic.length;document.getElementById('statReg').textContent=fReg.length;document.getElementById('statExp').textContent='$'+fExp.reduce((s,a)=>s+a.amount,0);const totalRev=[...fLic,...fReg].reduce((s,a)=>s+(a.amount||0),0),totalSal=fEmp.reduce((s,a)=>s+(a.salary||0),0),totalAdv=fAdv.reduce((s,a)=>s+a.amount,0),totalExp=fExp.reduce((s,a)=>s+a.amount,0),profit=totalRev-totalExp-totalSal-totalAdv;document.getElementById('statProfit').textContent='$'+profit;document.getElementById('financeSummary').innerHTML=`ايرادات:$${totalRev}<br>مصروفات:$${totalExp}<br>مرتبات:$${totalSal}<br>سلفيات:$${totalAdv}<br><hr>صافي:<b style="color:${profit>=0?'#10B981':'#EF4444'}">$${profit}</b>`;document.getElementById('recentTable').innerHTML=fAct.slice(-10).reverse().map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.client)}</td><td>$${a.amount}</td><td>${esc(a.branch)}</td><td><span class="status s-ok">${esc(a.status)}</span></td></tr>`).join('')||'<tr><td colspan=5>لا يوجد</td></tr>';document.getElementById('licTable').innerHTML=fLic.slice(-20).reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>$${r.amount}</td><td>${esc(r.branch)}</td><td><button class="btn btn-outline" onclick="reprint('license','${r.id}')">طباعة</button></td></tr>`).join('');document.getElementById('regTable').innerHTML=fReg.slice(-20).reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc(r.plate)}</td><td>$${r.amount}</td><td>${esc(r.branch)}</td><td><button class="btn btn-outline" onclick="reprint('registration','${r.id}')">طباعة</button></td></tr>`).join('');document.getElementById('expTable').innerHTML=fExp.slice(-20).reverse().map(r=>`<tr><td>${esc(r.dateStr)}</td><td>${esc(r.item)}</td><td>${esc(r.desc)}</td><td>$${r.amount}</td><td>${esc(r.branch)}</td></tr>`).join('');document.getElementById('empTable').innerHTML=fEmp.map(e=>{const empAdv=fAdv.filter(a=>a.empId===e.id).reduce((s,a)=>s+a.amount,0);return `<tr><td>${esc(e.name)}</td><td>${esc(e.title)}</td><td>${esc(e.grade)}</td><td>$${e.salary}</td><td>$${empAdv}</td><td><b>$${(e.salary||0)-empAdv}</b></td><td>${esc(e.branch)}</td></tr>`}).join('');document.getElementById('advTable').innerHTML=fAdv.slice(-20).reverse().map(r=>`<tr><td>${esc(r.dateStr)}</td><td>${esc(r.empName)}</td><td>$${r.amount}</td><td>${esc(r.reason)}</td><td>${esc(r.branch)}</td><td>${esc(r.status)}</td></tr>`).join('');updateAdvEmpSelect();genReport();renderBranchReports();renderBranchesList();}
function updateAdvEmpSelect(){const emps=store.get('employees');const fEmps=currentBranch==='main'&&currentRole==='admin'?emps:emps.filter(e=>e.branch===currentBranch);document.getElementById('adv_emp').innerHTML=fEmps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')||'<option>لا يوجد</option>';}
window.genReport=function(){const type=document.getElementById('rep_type').value,dateVal=document.getElementById('rep_date').value||new Date().toISOString().slice(0,10),branch=document.getElementById('rep_branch').value;const allLic=store.get('licenses'),allReg=store.get('registrations'),allExp=store.get('expenses'),allEmp=store.get('employees'),allAdv=store.get('advances');let filter=(arr)=>{let a=arr;if(branch!=='all')a=a.filter(x=>x.branch===branch);const d=new Date(dateVal);if(type==='daily')a=a.filter(x=>new Date(x.date).toDateString()===d.toDateString());if(type==='monthly')a=a.filter(x=>{const xd=new Date(x.date);return xd.getMonth()===d.getMonth()&&xd.getFullYear()===d.getFullYear()});if(type==='yearly')a=a.filter(x=>new Date(x.date).getFullYear()===d.getFullYear());if(type==='weekly'){const ws=new Date(d);ws.setDate(d.getDate()-d.getDay());const we=new Date(ws);we.setDate(ws.getDate()+6);a=a.filter(x=>{const xd=new Date(x.date);return xd>=ws&&xd<=we})}return a;};const fLic=filter(allLic),fReg=filter(allReg),fExp=filter(allExp),fEmp=branch==='all'?allEmp:allEmp.filter(e=>e.branch===branch),fAdv=filter(allAdv);const rev=[...fLic,...fReg].reduce((s,a)=>s+(a.amount||0),0),exp=fExp.reduce((s,a)=>s+a.amount,0),sal=fEmp.reduce((s,a)=>s+(a.salary||0),0),adv=fAdv.reduce((s,a)=>s+a.amount,0),profit=rev-exp-sal-adv;document.getElementById('reportContent').innerHTML=`<h4>تقرير ${type} - ${dateVal} - ${branch}</h4><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px"><div style="background:white;padding:12px;border-radius:10px;border:1px solid #E2E8F0">رخص $${fLic.reduce((s,a)=>s+(a.amount||0),0)}</div><div style="background:white;padding:12px;border-radius:10px;border:1px solid #E2E8F0">شهادات $${fReg.reduce((s,a)=>s+(a.amount||0),0)}</div><div style="background:white;padding:12px;border-radius:10px;border:1px solid #E2E8F0">مصروفات $${exp}</div><div style="background:white;padding:12px;border-radius:10px;border:1px solid #E2E8F0">مرتبات+سلفيات $${sal+adv}</div></div><table style="margin-top:14px"><tr><td>اجمالي ايرادات</td><td>$${rev}</td></tr><tr><td>مصروفات</td><td>$${exp}</td></tr><tr><td>مرتبات</td><td>$${sal}</td></tr><tr><td>سلفيات</td><td>$${adv}</td></tr><tr style="background:#FFF8E1;font-weight:700"><td>صافي</td><td>$${profit}</td></tr></table><p style="font-size:11px;color:#6B7A90;margin-top:10px">Developed by E-Mutwokil Sadik</p>`;}
window.printReport=function(){const content=document.getElementById('reportContent').innerHTML;document.getElementById('printArea').innerHTML=`<div style="padding:20px"><div style="background:#0A2540;color:white;padding:16px;border-radius:12px;display:flex;justify-content:space-between"><h2>ARINA GENERAL SERVICES</h2><div style="background:#FFC107;color:#0A2540;padding:8px 12px;border-radius:8px;font-weight:800">A</div></div>${content}</div>`;window.print();}
window.exportWhatsAppReport=function(){const text=document.getElementById('reportContent').innerText;window.open(`https://wa.me/?text=${encodeURIComponent('ARINA تقرير:\n'+text+'\nDeveloped by E-Mutwokil Sadik')}`,'_blank');}
function printReceipt(type,rec){const header=`<div style="background:#0A2540;color:white;padding:18px;display:flex;justify-content:space-between;border-bottom:6px solid #FFC107"><div><h2>ARINA GENERAL SERVICES</h2><p style="color:#FFC107;font-size:12px">${type==='license'?'رخصة قيادة':'شهادة بحث'}</p></div><div style="background:#FFC107;color:#0A2540;width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px">A</div></div>`;const footer=`<div style="margin-top:20px;padding:12px;border-top:1px solid #E2E8F0;display:flex;justify-content:space-between;font-size:10px;color:#6B7A90"><span>Branch:${esc(rec.branch)} | ${new Date().toLocaleString()}</span><span>Developed by <b>E-Mutwokil Sadik</b></span></div>`;let body=type==='license'?`<div style="padding:18px"><h3>ايصال رخصة ${esc(rec.id)}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:13px"><div><b>العميل:</b>${esc(rec.name)}</div><div><b>الهاتف:</b>${esc(rec.phone)}</div><div><b>النوع:</b>${esc(rec.type)}</div><div><b>المدة:</b>${esc(rec.duration)}</div><div><b>المبلغ:</b>$${rec.amount}</div><div><b>الدفع:</b>${esc(rec.pay)}</div></div></div>`:`<div style="padding:18px"><h3>ايصال شهادة ${esc(rec.id)}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px"><div><b>المالك:</b>${esc(rec.name)}</div><div><b>اللوحة:</b>${esc(rec.plate)}</div><div><b>النوع:</b>${esc(rec.vtype)}</div><div><b>الموديل:</b>${esc(rec.model)}</div><div><b>الشاسي:</b>${esc(rec.chassis)}</div><div><b>المبلغ:</b>$${rec.amount}</div></div></div>`;const full=`<div style="border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;max-width:700px;margin:auto;font-family:Cairo">${header}${body}${footer}</div>`;document.getElementById('receiptContent').innerHTML=full+`<div style="padding:16px;display:flex;gap:10px"><button class="btn btn-dark" onclick="window.print()">طباعة</button><button class="btn btn-outline" onclick="closeModal()">اغلاق</button></div>`;document.getElementById('receiptModal').classList.add('active');document.getElementById('printArea').innerHTML=full;}
window.reprint=function(type,id){const key=type==='license'?'licenses':'registrations';const rec=store.get(key).find(r=>r.id===id);if(rec)printReceipt(type,rec);}
window.closeModal=()=>document.getElementById('receiptModal').classList.remove('active');
window.clearForm=function(p){document.querySelectorAll('#page-'+p+' input, #page-'+p+' textarea').forEach(i=>i.value='');}
function renderBranchReports(){const allActs=store.get('activities');const branches=[...new Set(allActs.map(a=>a.branch))];const container=document.getElementById('branchReports');if(currentRole!=='admin'||currentBranch!=='main'){container.innerHTML='<p style="color:#6B7A90">للادارة الرئيسية فقط</p>';return;}container.innerHTML=branches.map(b=>{const acts=allActs.filter(a=>a.branch===b);const rev=acts.reduce((s,a)=>s+a.amount,0);return `<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin-bottom:10px"><b>فرع ${esc(b)}</b> - $${rev} - ${acts.length} عملية</div>`}).join('')||'لا يوجد';}
function renderBranchesList(){const branches=JSON.parse(localStorage.getItem('arina_branches')||'[{"name":"Main - Juba","code":"main","user":"admin"},{"name":"Wau","code":"wau","user":"manager"},{"name":"Malakal","code":"malakal","user":"manager"},{"name":"Yambio","code":"yambio","user":"manager"}]');document.getElementById('branchesTable').innerHTML=branches.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.code)}</td><td>${esc(b.user)}</td><td><span class="status s-ok">نشط</span></td></tr>`).join('');const opts=branches.map(b=>`<option value="${b.code}">${esc(b.name)}</option>`).join('');document.getElementById('branchSelect').innerHTML=opts;document.getElementById('rep_branch').innerHTML='<option value="all">كل الفروع</option>'+opts;}
window.addBranch=function(){const name=document.getElementById('newBranchName').value.trim(),code=document.getElementById('newBranchCode').value.trim().toLowerCase(),user=document.getElementById('newBranchUser').value.trim(),pass=document.getElementById('newBranchPass').value.trim();if(!name||!code){alert('ادخل اسم وكود');return}const branches=JSON.parse(localStorage.getItem('arina_branches')||'[]');branches.push({name,code,user,pass});localStorage.setItem('arina_branches',JSON.stringify(branches));alert('تمت اضافة الفرع: '+name);renderBranchesList();}
renderBranchesList();document.getElementById('rep_date').valueAsDate=new Date();
</script>
</body>
</html>
